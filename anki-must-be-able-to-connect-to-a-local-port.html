<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; URL=https://docs.ankiweb.net/faqs/anki-must-be-able-to-connect-to-a-local-port">
    <link rel="canonical" href="https://docs.ankiweb.net/faqs/anki-must-be-able-to-connect-to-a-local-port">
  </head>
  <body>
      <p>Redirecting to... <a href="https://docs.ankiweb.net/faqs/anki-must-be-able-to-connect-to-a-local-port">https://docs.ankiweb.net/faqs/anki-must-be-able-to-connect-to-a-local-port</a>.</p>

<script>
    // This handles redirects that involve fragments.
    document.addEventListener('DOMContentLoaded', function() {
        const fragmentMap =
            {}
        ;
        const fragment = window.location.hash;
        if (fragment) {
            let redirectUrl = "https://docs.ankiweb.net/faqs/anki-must-be-able-to-connect-to-a-local-port";
            const target = fragmentMap[fragment];
            if (target) {
                let url = new URL(target, window.location.href);
                redirectUrl = url.href;
            } else {
                let url = new URL(redirectUrl, window.location.href);
                url.hash = window.location.hash;
                redirectUrl = url.href;
            }
            window.location.replace(redirectUrl);
        }
        // else redirect handled by http-equiv
    });
</script>
  </body>
</html>
